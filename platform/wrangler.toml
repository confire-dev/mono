name = "confire-platform-dev"
pages_build_output_dir = "dist"
compatibility_date = "2025-05-01"

# Non-secret build env vars — secrets (SUPABASE keys, Stripe key) are set via:
#   wrangler pages secret put <KEY> --env production
#   wrangler pages secret put <KEY> --env preview

[vars]
PUBLIC_WORKER_URL = "https://api.dev.confire.dev"

# Production environment (confire.dev)
[env.production]
name = "confire-platform"

[env.production.vars]
PUBLIC_WORKER_URL = "https://api.confire.dev"
