name = "confire-platform-dev"
pages_build_output_dir = "./dist"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WORKER_URL = "https://api.dev.confire.dev"
PUBLIC_WORKER_URL = "https://api.dev.confire.dev"

[[services]]
binding = "WORKER_API"
service = "confire-worker-dev"

# Production environment (confire.dev)
[env.production]
name = "confire-platform"

[env.production.vars]
WORKER_URL = "https://api.confire.dev"
PUBLIC_WORKER_URL = "https://api.confire.dev"

[[env.production.services]]
binding = "WORKER_API"
service = "confire-worker"
