name: Deploy Platform (dev)

# Auto-deploys to dev.confire.dev on every push to main that touches the platform.
# Uses Cloudflare Pages Direct Upload (same pattern as prod — no git integration needed).
# Project: confire-platform-dev

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy platform to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @confire/platform --frozen-lockfile

      - name: Build
        working-directory: platform
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.DEV_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_WORKER_URL: https://api.dev.confire.dev
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.DEV_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name confire-platform-dev --branch main
