name: Deploy Worker (dev)

# Auto-deploys to api.dev.confire.dev on every push to main that touches the worker.
# Uses the [env.dev] environment in worker/wrangler.toml.

on:
  push:
    branches: [develop]
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @confire/worker --frozen-lockfile

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env dev
