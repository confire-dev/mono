name: Deploy Worker (production)

# Auto-deploys to api.confire.dev on every push to main that touches the worker.
# Uses the [env.production] environment in worker/wrangler.toml.
# Requires the "production" GitHub environment (configure in repo Settings → Environments).

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @confire/worker --frozen-lockfile

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production

      - name: Verify
        run: |
          sleep 3
          curl -sf https://api.confire.dev/health
          echo "Production worker healthy."
