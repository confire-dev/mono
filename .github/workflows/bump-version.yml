name: Bump version

# Runs on every push to main. Reads conventional commits since the last tag,
# decides the next semver bump (patch/minor/major), updates CHANGELOG.md,
# commits, and creates a new tag — which then triggers the release workflow.
#
# See docs/internal/conventional-commits.md

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: semver
        run: |
          # Latest tag (or v0.0.0 placeholder when the repo has no tags yet)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          # Skip when there is nothing to release, or only the release bump commit
          if [ -z "$COMMITS" ]; then
            echo "No commits since $LAST_TAG — skipping bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$COMMITS" | grep -qv "^chore(release):"; then
            : # real commits present
          else
            echo "Only release bump commit(s) since $LAST_TAG — skipping bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump level from conventional commit subjects
          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP="minor"
          fi
          echo "Bump level: $BUMP"

          VERSION="${LAST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: $NEXT"
          echo "next=${NEXT}"       >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}"       >> "$GITHUB_OUTPUT"
          echo "last=${LAST_TAG}"   >> "$GITHUB_OUTPUT"
          echo "skip=false"         >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        if: steps.semver.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.semver.outputs.next }}
          LAST: ${{ steps.semver.outputs.last }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          if git rev-parse "$LAST" >/dev/null 2>&1; then
            COMMITS=$(git log "${LAST}..HEAD" --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          fi

          # Drop merge commits and release bump commits from the changelog body
          COMMITS=$(echo "$COMMITS" | grep -Ev "^- Merge |^- chore\(release\):" || true)

          FEAT=$(echo "$COMMITS"  | grep -E "^- feat(\([^)]+\))?!:" || true)
          FIX=$(echo "$COMMITS"   | grep -E "^- fix(\([^)]+\))?:" || true)
          OTHER=$(echo "$COMMITS" | grep -Ev "^- feat(\([^)]+\))?!:|^- fix(\([^)]+\)?:" || true)

          ENTRY="## ${NEXT} — ${DATE}\n\n"
          [ -n "$FEAT"  ] && ENTRY="${ENTRY}### Features\n${FEAT}\n\n"
          [ -n "$FIX"   ] && ENTRY="${ENTRY}### Fixes\n${FIX}\n\n"
          [ -n "$OTHER" ] && ENTRY="${ENTRY}### Other\n${OTHER}\n\n"

          if [ -f CHANGELOG.md ]; then
            printf "%b\n---\n\n" "$ENTRY" | cat - CHANGELOG.md > /tmp/cl.md
          else
            printf "# Changelog\n\n%b\n" "$ENTRY" > /tmp/cl.md
          fi
          mv /tmp/cl.md CHANGELOG.md

          VER="${NEXT#v}"
          sed -i "s/version \"[^\"]*\"/version \"${VER}\"/" homebrew/confire.rb || true

      - name: Commit and tag
        if: steps.semver.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.semver.outputs.next }}
        run: |
          git add CHANGELOG.md homebrew/confire.rb
          git commit -m "chore(release): ${NEXT} [skip ci]"
          git tag "${NEXT}"
          git push origin main --tags
