name: Deploy Platform (production)

# Manual-only deploy of the Astro platform to confire.dev via Cloudflare Pages Direct Upload.
# The dev platform (dev.confire.dev) auto-deploys via Cloudflare Pages git integration — no workflow needed.
# Requires the "production" GitHub environment (configure in repo Settings → Environments).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy platform to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @confire/platform --frozen-lockfile

      - name: Build
        working-directory: platform
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PROD_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_WORKER_URL: https://api.confire.dev
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name confire-platform --branch main
