name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build and archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="github.com/confire-dev/confire/cmd"
          LDFLAGS="-s -w \
            -X '${PKG}.buildVersion=${VERSION}' \
            -X '${PKG}.buildCommit=${COMMIT}' \
            -X '${PKG}.buildDate=${DATE}' \
            -X '${PKG}.buildBuiltBy=ci'"

          ARCHIVE="confire_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          go build -trimpath -ldflags "${LDFLAGS}" -o confire .
          tar -czf "${ARCHIVE}" confire
          rm confire
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: confire_${{ matrix.goos }}_${{ matrix.goarch }}
          path: cli/confire_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum confire_*.tar.gz > checksums.txt

      - name: Show dist
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/confire_${{ github.ref_name }}_darwin_amd64.tar.gz
            dist/confire_${{ github.ref_name }}_darwin_arm64.tar.gz
            dist/confire_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/confire_${{ github.ref_name }}_linux_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          SHA_DARWIN_AMD64=$(grep "darwin_amd64" dist/checksums.txt | awk '{print $1}')
          SHA_DARWIN_ARM64=$(grep "darwin_arm64" dist/checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep  "linux_amd64"  dist/checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep  "linux_arm64"  dist/checksums.txt | awk '{print $1}')
          VER="${VERSION#v}"

          sed -i \
            -e "s/version \"[^\"]*\"/version \"${VER}\"/" \
            -e "s/PLACEHOLDER_SHA256_DARWIN_AMD64/${SHA_DARWIN_AMD64}/" \
            -e "s/PLACEHOLDER_SHA256_DARWIN_ARM64/${SHA_DARWIN_ARM64}/" \
            -e "s/PLACEHOLDER_SHA256_LINUX_AMD64/${SHA_LINUX_AMD64}/"   \
            -e "s/PLACEHOLDER_SHA256_LINUX_ARM64/${SHA_LINUX_ARM64}/"   \
            homebrew/confire.rb

          git clone \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/confire-ai/homebrew-confire.git" \
            tap-repo
          cp homebrew/confire.rb tap-repo/Formula/confire.rb
          cd tap-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/confire.rb
          git diff --staged --quiet || git commit -m "chore: bump confire to ${VERSION}"
          git push

  publish-r2:
    name: Publish to R2 (get.confire.dev)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum confire_*.tar.gz > checksums.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install wrangler
        run: pnpm install --filter @confire/distribution --frozen-lockfile

      - name: Upload to R2
        working-directory: distribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x ../scripts/publish-release-r2.sh
          ../scripts/publish-release-r2.sh "${{ github.ref_name }}" ../dist
