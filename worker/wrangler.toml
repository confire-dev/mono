name = "confire-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ── Local dev (wrangler dev) ──────────────────────────────────────────────────
# Top-level bindings are used only for local `wrangler dev`.
# All cloud deployments use --env dev or --env production explicitly.

[vars]
ENVIRONMENT = "local"
OPTIMIZER_API_ENABLED = "false"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000001"
preview_id = "00000000000000000000000000000001"

[[analytics_engine_datasets]]
binding = "AE"
dataset = "confire_events_dev"

# Rate limiting — burst protection only (not monthly quota; quota is enforced in Supabase).
# namespace_id is a number you choose; no CLI command needed. Defined here and active on deploy.
# Keyed by userId so limits are per user, not global.
[[ratelimits]]
name = "RL_FREE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_DEV"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_PRO"
namespace_id = "1003"
simple = { limit = 200, period = 60 }

[dev]
port = 8787
local_protocol = "http"

# ── dev environment (auto-deploys from main via CI) ───────────────────────────
# URL: https://api-dev.confire.dev
# Supabase: dev project
# Stripe: test mode keys

[env.dev]
name = "confire-worker-dev"

[env.dev.vars]
ENVIRONMENT = "development"
OPTIMIZER_API_ENABLED = "false"

[[env.dev.routes]]
pattern = "api-dev.confire.dev/*"
zone_name = "confire.dev"

# Create with: wrangler kv namespace create confire_cache_dev
#              wrangler kv namespace create confire_cache_dev --preview
[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_DEV_KV_ID"
preview_id = "REPLACE_WITH_DEV_KV_PREVIEW_ID"

[[env.dev.analytics_engine_datasets]]
binding = "AE"
dataset = "confire_events_dev"

[[env.dev.ratelimits]]
binding = "RL_FREE"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[[env.dev.ratelimits]]
binding = "RL_DEV"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
binding = "RL_PRO"
namespace_id = "2003"
simple = { limit = 200, period = 60 }

# Secrets — set with: wrangler secret put <NAME> --env dev
# SUPABASE_URL             — dev Supabase project URL
# SUPABASE_ANON_KEY        — dev anon/public key
# SUPABASE_SERVICE_KEY     — dev service role key
# AMPLITUDE_KEY            — Amplitude API key (can share with prod)
# STRIPE_SECRET_KEY        — Stripe test mode secret key (sk_test_...)
# STRIPE_WEBHOOK_SECRET    — Stripe test webhook signing secret
# STRIPE_TOPUP_PRICE_ID    — test-mode top-up price ID
# SUPABASE_WEBHOOK_SECRET  — generate: openssl rand -base64 32

# ── production environment (manual deploy only) ───────────────────────────────
# URL: https://api.confire.dev
# Supabase: prod project
# Stripe: live mode keys

[env.production]
name = "confire-worker"

[env.production.vars]
ENVIRONMENT = "production"
OPTIMIZER_API_ENABLED = "false"

[[env.production.routes]]
pattern = "api.confire.dev/*"
zone_name = "confire.dev"

# Create with: wrangler kv namespace create confire_cache
#              wrangler kv namespace create confire_cache --preview
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_PROD_KV_ID"
preview_id = "REPLACE_WITH_PROD_KV_PREVIEW_ID"

[[env.production.analytics_engine_datasets]]
binding = "AE"
dataset = "confire_events"

[[env.production.ratelimits]]
binding = "RL_FREE"
namespace_id = "3001"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
binding = "RL_DEV"
namespace_id = "3002"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
binding = "RL_PRO"
namespace_id = "3003"
simple = { limit = 200, period = 60 }

# Secrets — set with: wrangler secret put <NAME> --env production
# SUPABASE_URL             — prod Supabase project URL
# SUPABASE_ANON_KEY        — prod anon/public key
# SUPABASE_SERVICE_KEY     — prod service role key
# AMPLITUDE_KEY            — Amplitude API key
# STRIPE_SECRET_KEY        — Stripe live secret key (sk_live_...)
# STRIPE_WEBHOOK_SECRET    — Stripe live webhook signing secret
# STRIPE_TOPUP_PRICE_ID    — live top-up price ID
# SUPABASE_WEBHOOK_SECRET  — generate: openssl rand -base64 32
