name = "confire-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# KV — content-hash optimizer cache (24h TTL, ~1ms lookup)
# Local dev uses a local SQLite-backed KV store — IDs only matter for production deploy.
# Replace with real IDs from: wrangler kv namespace create confire-cache
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000001"
preview_id = "00000000000000000000000000000001"

# Analytics Engine — real-time counters for the dashboard
# Run: wrangler analytics-engine dataset create confire-events
[[analytics_engine_datasets]]
binding = "AE"
dataset = "confire_events"

# Secrets (set via: wrangler secret put <NAME>)
# SUPABASE_URL             — your Supabase project URL
# SUPABASE_ANON_KEY        — Supabase anon/public key
# SUPABASE_SERVICE_KEY     — Supabase service role key (server-side only)
# AMPLITUDE_KEY            — Amplitude HTTP API key
# STRIPE_WEBHOOK_SECRET    — Stripe webhook signing secret
# SUPABASE_WEBHOOK_SECRET  — shared secret for Supabase DB webhooks
#                            Set in Supabase: Database → Webhooks → HTTP Headers
#                            Key: Authorization   Value: Bearer <this secret>

[dev]
port = 8787
local_protocol = "http"

[env.dev.vars]
ENVIRONMENT = "development"
